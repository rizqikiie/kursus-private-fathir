<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Descendant Selector</title>
    <style>
        div p {
            color: blue;
        }
    </style>
</head>
<body>
    <div>
        <p>Ini paragraf di dalam div</p>
        <article>
            <p>Ini paragraf di dalam article</p>
        </article>
    </div>
    <p>Ini paragraf diluar div</p>
</body>
</html>
