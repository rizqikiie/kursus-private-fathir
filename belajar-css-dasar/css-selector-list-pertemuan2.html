<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector List</title>
    <style>
        h1, h2, #title {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Ini adalah title</h1>
    <h2>Ini adalah sub title</h2>
    <h3>Ini adalah sub sub title</h3>
    <h4 id="title">ini adalah sub sub sub title</h4>
</body>
</html>
