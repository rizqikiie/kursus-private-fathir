<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribut Selector</title>
    <style>
        a[target="_blank"] {
            color: red;
        }
    </style>
</head>
<body>
    <a href="https://www.example.com" target="_blank">Link dengan target _blank (berwarna merah)</a><br>
    <a href="https://www.example.com" target="_self">Link dengan target _self (berwarna default)</a><br>
    <a href="https://www.example.com">Link tanpa atribut target (berwarna default)</a>
</body>
</html>
