<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Multiple Class</title>
    <style>
        .green {
            color: green;
        }
        
        .red {
            color: red;
        }

        .upper {
            text-transform: uppercase;
        }

        .large {
            font-size: 50px;
        }

      
    </style>
</head>
<body>
    <h1>Ini judul tanpa class</h1>
    <h1 class="red upper large">Ini judul dengan class red, uppercase dan large</h1>
    <h1 class="red upper">Ini judul dengan class red dan uppercase</h1>
    <h1 class="red">ini judul dengan class red</h1>
    <h1 class="upper">ini judul dengan class uppercase</h1>
    <h1 class="red green">Test Timpa</h1>
</body>
</html>
