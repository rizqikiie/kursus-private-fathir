<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[attribut~="value"] Selector</title>
    <style>
        p[title~="belajar"] {
            color: red;
        }
    </style>
</head>
<body>
    <p title="belajar pemrograman">ini dipilih</p>
    <p title="belajarpemrograman">ini tidak dipilih</p>
</body>
</html>
